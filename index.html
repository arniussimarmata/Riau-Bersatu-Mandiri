<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Card RMS</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Library PDF & ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#FAF8F5] text-slate-800 min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-3xl w-full space-y-4">
        
        <!-- KOTAK PUSAT DOWNLOAD -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-amber-100/60 mt-10">
            <h3 class="font-extrabold text-lg text-emerald-800 mb-4">
                <i class="fa-solid fa-id-card mr-2"></i> Pusat Unduh E-Card Anggota
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-amber-50/50 p-4 rounded-2xl border border-amber-200/60 mb-6">
                <!-- Download Satuan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">1. Unduh Satuan (Pilih Anggota)</label>
                    <div class="flex gap-2">
                        <select id="select-single-member-ecard" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:border-emerald-700">
                            <option value="">-- Memuat data... --</option>
                        </select>
                        <button onclick="downloadSelectedSingleECard()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 flex items-center gap-1 shadow">
                            <i class="fa-solid fa-download"></i> Unduh PDF
                        </button>
                    </div>
                </div>
                
                <!-- Download Massal -->
                <div class="flex flex-col justify-end">
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">2. Unduh Semua (ZIP Massal)</label>
                    <button onclick="downloadAllECardsZip()" class="bg-amber-600 hover:bg-amber-700 text-white w-full py-2.5 rounded-xl text-xs font-bold transition shadow flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-zipper"></i> Unduh ZIP Massal (PDF & JPG)
                    </button>
                </div>
            </div>

            <!-- List Anggota -->
            <h4 class="font-extrabold text-sm text-slate-800 mb-3">
                <i class="fa-solid fa-address-book text-emerald-800 mr-1"></i> Daftar Anggota
            </h4>
            <div id="members-list-container" class="space-y-2"></div>
        </div>

    </div>

    <!-- Area Notifikasi -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] space-y-2"></div>

    <!-- Panggil file app.js -->
    <script src="./app.js"></script>
</body>
</html>
